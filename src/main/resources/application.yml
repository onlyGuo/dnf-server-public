server:
  port: 9001
spring:
  servlet:
    multipart:
      max-file-size: ${DNF_IMAGEPACKS_MAX_UPLOAD_SIZE:32GB}
      max-request-size: ${DNF_IMAGEPACKS_MAX_REQUEST_SIZE:33GB}
      file-size-threshold: 0
  application:
    name: DNF Server Management Platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/dnf_service?useUnicode=true&characterEncoding=utf8&autoReconnect=true}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    driver-class-name: com.mysql.jdbc.Driver
  freemarker:
    suffix: .ftl
  resources:
    static-locations:
      - classpath:/META-INF/resources/
      - classpath:/resources/
      - classpath:/static/
      - classpath:/public/
      - file:${DNF_FRONTEND_DIR:webui2/dist}/
mybatis:
  mapper-locations: classpath*:mappers/*.xml
  type-aliases-package: com.aiyi.game.dnfserver.entity
logging:
  file: logs/dnf.log
  level:
    com.aiyi: INFO

# 自动发现当前进程可见的 DNF 游戏目录和 Supervisor；没有游戏服务时，
# 仍可使用数据库相关功能。目录可以按本机部署位置调整。
dnf:
  frontend-dir: ${DNF_FRONTEND_DIR:webui2/dist}
  private-key-path: ${DNF_PRIVATE_KEY_PATH:}
  keys:
    gateway-private-key-path: ${DNF_GATE_PRIVATE_KEY_PATH:}
  member:
    reset-enabled: ${DNF_MEMBER_RESET_ENABLED:true}
  channels:
    enabled: ${DNF_CHANNELS_ENABLED:auto}
    data-dir: ${DNF_DATA_DIR:/data}
    game-dir: ${DNF_GAME_DIR:/home/neople/game}
    server-group: ${SERVER_GROUP:3}
    supervisorctl: ${DNF_SUPERVISORCTL:/usr/local/bin/supervisorctl}
    monitor-script: ${DNF_MONITOR_SCRIPT:/home/template/init/monitor_ip/monitor_ip.sh}
    interval-ms: ${DNF_CHANNEL_DDNS_INTERVAL_MS:10000}

aliyun:
  access-key-id: 这里填写你从阿里云申请的access-key-id 否则注册时无法发送短信
  access-secret: 这里填写你从阿里云申请的access-secret 否则注册时无法发送短信
  oss:
    endpoint: 这里不用管，预留，后续制作全自动更新版本时可能用得上
    bucket-name: 这里不用管，预留，后续制作全自动更新版本时可能用得上
